<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#0a0c10">
<title>Outside</title>
<meta name="description" content="Your kind of places, events and people, wherever you land. Built on Qloo's taste graph.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="signup">
  <header class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <span class="brand-name">Outside</span>
  </header>

  <section class="stage" aria-hidden="true">
    <svg id="scene" class="scene" viewBox="0 0 400 220" data-level="0">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#241a2e"/></linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16203a"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
        <linearGradient id="tarmac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2232"/><stop offset="1" stop-color="#2a3142"/></linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff3b30" stop-opacity="0.7"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="400" height="220" fill="url(#sky)"/>
      <g class="stars"><circle cx="40" cy="22" r="1.2"/><circle cx="92" cy="40" r="1"/><circle cx="150" cy="16" r="1.3"/><circle cx="330" cy="30" r="1"/><circle cx="372" cy="14" r="1.2"/><circle cx="210" cy="26" r="0.9"/></g>

      <!-- The Lekki–Ikoyi Link Bridge on the horizon: one tower, fanned cables -->
      <g class="bridge">
        <path class="tower" d="M253 100 L257 36 L261 100"/>
        <g class="cables">
          <path d="M257 42 L150 98"/><path d="M257 50 L178 98"/><path d="M257 58 L206 98"/><path d="M257 66 L230 98"/>
          <path d="M257 42 L362 98"/><path d="M257 50 L336 98"/><path d="M257 58 L308 98"/><path d="M257 66 L284 98"/>
        </g>
        <path class="deck" d="M110 99 L400 97"/>
        <g class="bridge-lights"><circle cx="150" cy="98.5" r="1.4"/><circle cx="206" cy="98" r="1.4"/><circle cx="308" cy="97.6" r="1.4"/><circle cx="362" cy="97.3" r="1.4"/><circle cx="257" cy="36" r="2"/></g>
        <text class="sign" x="296" y="88">IKOYI LINK</text>
      </g>

      <rect y="100" width="400" height="120" fill="url(#water)"/>
      <g class="glints"><path d="M30 130h30M60 170h22M330 140h34M320 186h26M18 200h20M368 206h18"/></g>

      <!-- The road, running away from us to the bridge -->
      <path class="road" d="M196 100 L204 100 L330 220 L70 220 Z" fill="url(#tarmac)"/>
      <path class="kerb" d="M196 100 L70 220 M204 100 L330 220"/>
      <path class="lane" d="M200 102 L200 220"/>

      <!-- Street lights along both sides, shrinking with distance -->
      <g class="lamps">
        <path d="M86 205 V160 h8"/><circle cx="96" cy="160" r="2.6"/>
        <path d="M124 166 V136 h6"/><circle cx="131" cy="136" r="2"/>
        <path d="M156 132 V116 h4"/><circle cx="161" cy="116" r="1.4"/>
        <path d="M314 205 V160 h-8"/><circle cx="304" cy="160" r="2.6"/>
        <path d="M276 166 V136 h-6"/><circle cx="269" cy="136" r="2"/>
        <path d="M244 132 V116 h-4"/><circle cx="239" cy="116" r="1.4"/>
      </g>

      <!-- The danfo, from behind -->
      <g id="danfo" class="danfo">
        <g class="body-bob">
          <ellipse class="shadow" cx="200" cy="208" rx="58" ry="5"/>
          <rect class="wheel" x="155" y="190" width="18" height="18" rx="4"/>
          <rect class="wheel" x="227" y="190" width="18" height="18" rx="4"/>
          <rect class="roof" x="160" y="104" width="80" height="5" rx="2"/>
          <rect class="bus" x="150" y="108" width="100" height="88" rx="10"/>
          <rect class="win" x="160" y="116" width="80" height="34" rx="5"/>
          <g class="pax p1"><circle cx="173" cy="134" r="5"/><path d="M164 150 a9 7 0 0 1 18 0z"/></g>
          <g class="pax p2"><circle cx="192" cy="133" r="5"/><path d="M183 150 a9 7 0 0 1 18 0z"/></g>
          <g class="pax p3"><circle cx="210" cy="134" r="5"/><path d="M201 150 a9 7 0 0 1 18 0z"/></g>
          <g class="pax p4"><circle cx="228" cy="133" r="5"/><path d="M219 150 a9 7 0 0 1 18 0z"/></g>
          <rect class="stripe" x="150" y="156" width="100" height="6"/>
          <rect class="stripe" x="150" y="166" width="100" height="3"/>
          <circle class="glow g1" cx="161" cy="180" r="14"/>
          <circle class="glow g2" cx="239" cy="180" r="14"/>
          <rect class="tail" x="155" y="173" width="12" height="14" rx="2"/>
          <rect class="tail" x="233" y="173" width="12" height="14" rx="2"/>
          <rect class="plate-bg" x="182" y="176" width="36" height="11" rx="2"/>
          <text class="plate" x="200" y="184">OUTSIDE</text>
          <rect class="bumper" x="146" y="190" width="108" height="6" rx="3"/>
          <rect class="exhaust" x="160" y="194" width="9" height="5" rx="2"/>
          <!-- the conductor hanging off the side door -->
          <g class="conductor"><circle cx="259" cy="122" r="5"/><path d="M259 127 v20 M259 133 l-9 -6 M259 147 l-5 12 M259 147 l6 12"/></g>
        </g>
        <g class="smoke"><circle cx="160" cy="198" r="4"/><circle cx="160" cy="198" r="4"/><circle cx="160" cy="198" r="4"/><circle cx="160" cy="198" r="4"/></g>
      </g>
    </svg>
  </section>

  <form id="form" class="card" novalidate>
    <h1>Hop on the danfo</h1>
    <p class="sub">Three quick things and the bus leaves. Next stop: <em>outside</em>.</p>

    <label class="field">
      <span>First name</span>
      <input id="firstName" name="firstName" autocomplete="given-name" maxlength="30" placeholder="Tolu" required>
    </label>
    <label class="field">
      <span>Email</span>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com" required>
    </label>
    <label class="field">
      <span>Where's home?</span>
      <input id="homeCity" name="homeCity" autocomplete="address-level2" maxlength="40" placeholder="Houston, London, Atlanta…" list="cities" required>
      <datalist id="cities">
        <option value="Houston"><option value="Atlanta"><option value="New York"><option value="London"><option value="Toronto"><option value="Dallas"><option value="Washington DC"><option value="Manchester"><option value="Lagos">
      </datalist>
    </label>

    <p id="caption" class="caption" aria-live="polite">The bus is waiting for passengers…</p>

    <button id="go" class="btn-primary" type="submit" disabled>Outside</button>
    <p id="error" class="error" role="alert" hidden></p>
    <p class="fine">We only show your first name to people you choose. Never your email.</p>
  </form>
</main>
<script type="module" src="/signup.js"></script>
</body>
</html>
