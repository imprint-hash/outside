<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e16">
<title>Outside · Tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<link rel="stylesheet" href="/app.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
</head>
<body>
<header class="topbar"></header>

<section class="ribbon" id="ribbon" aria-label="Filters">
  <div class="row" role="group" aria-label="When">
    <button class="pill" type="button" data-when="now" aria-pressed="false"><span class="live" aria-hidden="true"></span><span>Now <span id="nowClock"></span></span></button>
    <button class="pill" type="button" data-when="tonight" aria-pressed="true">Tonight</button>
    <button class="pill" type="button" data-when="week" aria-pressed="false">This week</button>
    <span class="sep" aria-hidden="true"></span>
    <span class="here-chip" id="checkinChip" hidden></span>
  </div>
  <div class="row kinds" role="group" aria-label="What">
    <button class="chip" type="button" data-kind="all" aria-pressed="true">All</button>
    <button class="chip" type="button" data-kind="food" aria-pressed="false"><span class="ms" aria-hidden="true">restaurant</span>Food</button>
    <button class="chip" type="button" data-kind="drinks" aria-pressed="false"><span class="ms" aria-hidden="true">local_bar</span>Drinks</button>
    <button class="chip" type="button" data-kind="music" aria-pressed="false"><span class="ms" aria-hidden="true">graphic_eq</span>Music</button>
    <button class="chip" type="button" data-kind="comedy" aria-pressed="false"><span class="ms" aria-hidden="true">theater_comedy</span>Comedy</button>
  </div>
</section>

<main class="split" id="split">
  <section class="stream" id="stream" aria-label="Places and events for you" aria-busy="true">
    <div class="stream-head">
      <h2><span class="ms" aria-hidden="true">radar</span>Your matches</h2>
      <span class="sort">Most people like you first</span>
    </div>
    <div id="streamBody">
      <div class="skeleton" style="height:420px"></div>
    </div>
  </section>

  <section class="mapcol" aria-label="Map">
    <div class="map-dock">
      <span class="dock-note" id="originNote"><span class="ms" aria-hidden="true">near_me</span><span>Around you</span></span>
      <span class="dock-note"><span class="ms" aria-hidden="true">visibility_off</span>Counts only. Nobody's location is shown.</span>
    </div>
    <div class="mapwrap">
      <div id="map" role="application" aria-label="Map of places and events"></div>
      <div class="legend" aria-hidden="true">
        <span><i class="l-mint"></i>People like you here</span>
        <span><i class="l-amber"></i>Fits your taste</span>
        <span><i class="l-quiet"></i>Quiet</span>
      </div>
      <div class="map-tools">
        <div class="stack">
          <button type="button" id="zoomIn" aria-label="Zoom in"><span class="ms" aria-hidden="true">add</span></button>
          <hr>
          <button type="button" id="zoomOut" aria-label="Zoom out"><span class="ms" aria-hidden="true">remove</span></button>
        </div>
        <button type="button" class="solo mode" id="pitchToggle" aria-pressed="true" aria-label="Flat map">2D</button>
        <button type="button" class="solo" id="recenter" aria-label="Back to where you're staying"><span class="ms" aria-hidden="true">my_location</span></button>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/tonight.js"></script>
</body>
</html>
